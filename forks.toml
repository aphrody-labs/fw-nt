# Single manifest of the fw-nt forks. Each fork lives in aphrody-labs/<name> and is a shallow submodule under third_party/<name>
# with a relative URL (../<name>.git). `bun tools/sync.ts` fast-forwards every fork from its upstream and bumps the gitlinks
# from `git ls-remote` (no clone), locally and in CI.

[[fork]]
name = "PowerShell"
upstream = "PowerShell/PowerShell"
branch = "master"
lang = "C#"
role = "pwsh: the shell and automation runtime of the NT layer"

[[fork]]
name = "intelligent-terminal"
upstream = "microsoft/intelligent-terminal"
branch = "main"
lang = "C++"
role = "Windows Terminal fork with native ACP agent panes (Claude, Copilot, Antigravity)"

